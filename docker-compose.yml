# Local development / demo stack
#   docker compose up -d --build
#   App:     http://localhost:8000
#   Adminer: http://localhost:8080  (server: mysql, user: rijschool, password: secret)

services:
  app:
    build: .
    image: rijschool-app:latest
    container_name: rijschool_app
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "8000:80"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: rijschool_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rijschool
      MYSQL_USER: rijschool
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: rijschool_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

volumes:
  db_data:
    name: rijschool_db_data
  app_storage:
    name: rijschool_app_storage
