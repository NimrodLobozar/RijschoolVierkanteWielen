# Production stack for CasaOS / Portainer
#
# Portainer → Stacks → Add stack → Repository
#   Compose path: docker-compose.prod.yml
#   Environment variables: see stack.env.example
#
# Portainer builds the image from the repository. If you push a prebuilt image
# to a registry instead, set APP_IMAGE to it.

services:
  app:
    build: .
    image: ${APP_IMAGE:-rijschool-app:latest}
    container_name: rijschool_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    environment:
      APP_NAME: "Rijschool Vierkantewielen"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8085}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: nl_NL
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rijschool}
      DB_USERNAME: ${DB_USERNAME:-rijschool}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: ${SEED_DATABASE:-false}
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: rijschool_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-rijschool}
      MYSQL_USER: ${DB_USERNAME:-rijschool}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    name: rijschool_db_data
  app_storage:
    name: rijschool_app_storage
